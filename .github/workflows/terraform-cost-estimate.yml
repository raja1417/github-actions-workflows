name: Terraform cost estimate

# Infracost reports a static estimate from configuration; this workflow never
# applies Terraform changes and initializes without a remote backend.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform configuration.
        required: false
        default: .
        type: string
      terraform-version:
        description: Terraform CLI version to install.
        required: false
        default: 1.9.8
        type: string
      output-file:
        description: File name for Infracost JSON output.
        required: false
        default: infracost.json
        type: string
    secrets:
      infracost-api-key:
        description: Infracost API key used to retrieve pricing data.
        required: true
      terraform-cloud-token:
        description: Optional Terraform Cloud token for private module access.
        required: false
    outputs:
      monthly-cost:
        description: Estimated total monthly cost.
        value: ${{ jobs.estimate.outputs.monthly-cost }}
      currency:
        description: Currency used for the monthly-cost output.
        value: ${{ jobs.estimate.outputs.currency }}

permissions:
  contents: read

jobs:
  estimate:
    name: Estimate Terraform costs
    runs-on: ubuntu-latest
    outputs:
      monthly-cost: ${{ steps.cost.outputs.monthly-cost }}
      currency: ${{ steps.cost.outputs.currency }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_TOKEN_app_terraform_io: ${{ secrets.terraform-cloud-token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Initialize providers without a backend
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -backend=false -input=false

      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.infracost-api-key }}

      - name: Estimate monthly cost
        id: cost
        working-directory: ${{ inputs.working-directory }}
        env:
          OUTPUT_FILE: ${{ inputs.output-file }}
        run: |
          infracost breakdown --path . --format json --out-file "$OUTPUT_FILE"
          echo "monthly-cost=$(jq -r '.totalMonthlyCost // "0"' "$OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
          echo "currency=$(jq -r '.currency // "USD"' "$OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
