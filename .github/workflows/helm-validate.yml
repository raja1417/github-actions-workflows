name: Helm validate

on:
  workflow_call:
    inputs:
      chart-path: { required: true, type: string }
      values-file: { required: false, type: string, default: values.yaml }
      kubernetes-version: { required: false, type: string, default: "1.30.0" }
      run-checkov: { required: false, type: boolean, default: false }
      checkov-framework: { required: false, type: string, default: all }
    secrets: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Lint chart
        run: helm lint "${{ inputs.chart-path }}" --values "${{ inputs.chart-path }}/${{ inputs.values-file }}"
      - name: Render chart
        run: |
          mkdir -p rendered
          helm template validation "${{ inputs.chart-path }}" --values "${{ inputs.chart-path }}/${{ inputs.values-file }}" --kube-version "${{ inputs.kubernetes-version }}" > rendered/rendered.yaml
      - name: Validate rendered manifests
        run: kubectl apply --dry-run=client --validate=false -f rendered/rendered.yaml
      - name: Run Checkov on rendered manifests
        if: ${{ inputs.run-checkov }}
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: rendered
          framework: ${{ inputs.checkov-framework }}
          soft_fail: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: helm-rendered-manifest, path: rendered/rendered.yaml, if-no-files-found: warn }
