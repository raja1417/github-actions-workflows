name: Docker build and push

on:
  workflow_call:
    inputs:
      image: { required: true, type: string }
      tags: { required: true, type: string }
      context: { required: false, type: string, default: . }
      file: { required: false, type: string, default: Dockerfile }
      push: { required: false, type: boolean, default: true }
      platforms: { required: false, type: string, default: linux/amd64 }
      scan: { required: false, type: boolean, default: false }
    secrets:
      registry-username: { required: false }
      registry-password: { required: false }
    outputs:
      digest:
        description: Image digest
        value: ${{ jobs.build.outputs.digest }}

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: ${{ inputs.push && secrets.registry-username != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan pushed image
        if: ${{ inputs.scan && inputs.push }}
        # v0.35.0 defaults to Trivy v0.69.3, avoiding the compromised v0.69.4 release.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          version: v0.69.3
