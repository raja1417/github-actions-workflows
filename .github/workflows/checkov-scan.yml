name: Checkov infrastructure scan

on:
  workflow_call:
    inputs:
      directory: { required: false, type: string, default: . }
      framework: { required: false, type: string, default: terraform }
      soft-fail: { required: false, type: boolean, default: false }
    secrets: {}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.directory }}
          framework: ${{ inputs.framework }}
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: ${{ inputs.soft-fail }}
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: checkov.sarif/results_sarif.sarif }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: checkov-report, path: checkov.sarif, if-no-files-found: warn }
