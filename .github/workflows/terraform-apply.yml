name: Terraform apply

# Use an environment in the calling repository to require approval before an
# apply. Automatic approval remains opt-in and defaults to false.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform configuration.
        required: false
        default: .
        type: string
      terraform-version:
        description: Terraform CLI version to install.
        required: false
        default: 1.9.8
        type: string
      init-args:
        description: Additional Terraform init options.
        required: false
        default: -input=false
        type: string
      environment:
        description: GitHub environment used for deployment protection rules.
        required: false
        default: terraform
        type: string
      auto-approve:
        description: Pass -auto-approve to Terraform. Keep false for interactive review.
        required: false
        default: false
        type: boolean
    secrets:
      terraform-cloud-token:
        description: Optional Terraform Cloud token for private module access.
        required: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Terraform changes
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Avoid concurrent state mutations for the same repository and Terraform directory.
    concurrency:
      group: terraform-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_CLI_ARGS_init: ${{ inputs.init-args }}
      TF_TOKEN_app_terraform_io: ${{ secrets.terraform-cloud-token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: ${{ inputs.working-directory }}
        run: terraform init

      - name: Apply Terraform changes
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.auto-approve }}" = "true" ]; then
            terraform apply -auto-approve -input=false -no-color
          else
            terraform apply -input=false -no-color
          fi
