name: Helm rollback

on:
  workflow_call:
    inputs:
      release-name: { required: true, type: string }
      namespace: { required: true, type: string }
      revision: { required: true, type: number }
      environment: { required: false, type: string, default: dev }
      timeout: { required: false, type: string, default: 10m }
    secrets:
      kubeconfig: { required: true }
  workflow_dispatch:
    inputs:
      release-name: { required: true, type: string }
      namespace: { required: true, type: string }
      revision: { required: true, type: number }
      environment: { required: true, type: string, default: dev }
      timeout: { required: false, type: string, default: 10m }

permissions: { contents: read }

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/setup-helm@v4
      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.kubeconfig }}
        run: |
          umask 077; printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Roll back release
        run: helm rollback "${{ inputs.release-name }}" "${{ inputs.revision }}" --namespace "${{ inputs.namespace }}" --wait --cleanup-on-fail --timeout "${{ inputs.timeout }}"
      - name: Show release history
        run: helm history "${{ inputs.release-name }}" --namespace "${{ inputs.namespace }}"
